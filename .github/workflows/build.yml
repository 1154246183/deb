name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo tree
        run: |
          echo "=== 工作目录 ==="; pwd
          echo "=== 顶层文件 ==="; ls -la
          echo "=== 递归 ==="; find . -maxdepth 2 -not -path './.git/*' | sort

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang fakeroot git curl unzip xz-utils libssl-dev perl ldid || true
          which ldid && ldid -v 2>&1 | head -2 || echo "apt ldid 不可用"

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk'
          cp -r /tmp/sdkrepo/*.sdk $HOME/theos/sdks/ 2>/dev/null || true
          ls -d $HOME/theos/sdks/*.sdk || echo "没有 SDK"

      - name: Ensure ldid
        run: |
          if ! command -v ldid >/dev/null 2>&1; then
            echo "从源码编译 ldid"
            git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
            cd /tmp/ldid
            make -j$(nproc) CXXFLAGS="-std=c++17 -I. -I./src"
            sudo install -m755 ./ldid /usr/local/bin/ldid
          fi
          ldid -v 2>&1 | head -3 || echo "ldid 就绪"

      - name: Build package
        run: |
          set -x
          ls -la
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          find . -name '*.deb' -ls

      - name: Show artifacts
        if: always()
        run: |
          ls -la packages 2>/dev/null || true
          find . -name '*.deb' 2>/dev/null || true
          find . -name '*.dylib' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn
