name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang fakeroot git curl unzip xz-utils libssl-dev perl
          sudo apt-get install -y libplist-utils

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk' 'iPhoneOS15.6.sdk'
          cp -r /tmp/sdkrepo/*.sdk $HOME/theos/sdks/ 2>/dev/null || true
          ls -d $HOME/theos/sdks/*.sdk

      - name: Install ldid (prebuilt)
        run: |
          # 优先用 apt 里的，没有就下预编译
          if sudo apt-get install -y ldid 2>/dev/null; then
            ldid -v || echo "apt ldid ok"
          else
            curl -L -o /tmp/ldid.zip https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64.zip || true
            if [ -f /tmp/ldid.zip ]; then
              unzip -o /tmp/ldid.zip -d /tmp/ldidbin || true
              sudo cp /tmp/ldidbin/ldid /usr/local/bin/ldid 2>/dev/null || true
              sudo chmod +x /usr/local/bin/ldid 2>/dev/null || true
            fi
          fi
          which ldid || echo "NO LDID"
          ldid -v 2>&1 | head -3 || true

      - name: Build package
        run: |
          cd tweak
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          find . -name '*.deb' -ls

      - name: Show artifacts
        if: always()
        run: |
          ls -la tweak/packages 2>/dev/null || true
          find tweak -name '*.deb' 2>/dev/null || true
          find tweak -name '*.dylib' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN
          path: |
            tweak/packages/*.deb
            tweak/.theos/obj/**/*.dylib
          if-no-files-found: warn
