name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make fakeroot git curl unzip xz-utils \
            clang lld llvm libssl-dev libplist-dev pkg-config perl
          echo "--- 工具位置 ---"
          which clang ld.lld lld ld64.lld || true
          ls -l /usr/bin/ld.lld* /usr/bin/lld* 2>/dev/null | head

      - name: Install ldid
        run: |
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc) CXXFLAGS="-std=c++17 -I. -I./src"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -1

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          mkdir -p $HOME/theos/sdks

      - name: Download iOS SDK 16.5
        run: |
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk'
          cp -r /tmp/sdkrepo/*.sdk $HOME/theos/sdks/
          ls -d $HOME/theos/sdks/*.sdk

      - name: Fix toolchain (clang + lld)
        run: |
          set -eux
          TC=$HOME/theos/toolchain/linux/iphone
          mkdir -p $TC/bin

          # 编译器
          ln -sf /usr/bin/clang      $TC/bin/clang
          ln -sf /usr/bin/clang++    $TC/bin/clang++

          # 关键：链接器必须是 LLD（GNU ld 不认 -fuse-ld=llvm，也不支持 Mach-O）
          LLD=$(ls /usr/bin/ld.lld* /usr/lib/llvm-*/bin/ld.lld 2>/dev/null | head -1)
          [ -z "$LLD" ] && LLD=$(which ld.lld || true)
          echo "找到 LLD: $LLD"
          if [ -z "$LLD" ]; then echo "LLD 缺失，尝试安装 lld-17"; sudo apt-get install -y lld-17; LLD=$(ls /usr/bin/ld.lld-17); fi
          ln -sf "$LLD" $TC/bin/ld
          ln -sf "$LLD" $TC/bin/ld.lld

          # 其余 binutils
          for t in nm strip ar ranlib; do
            [ -x /usr/bin/$t ] && ln -sf /usr/bin/$t $TC/bin/$t
          done
          ln -sf /usr/local/bin/ldid $TC/bin/ldid

          ls -la $TC/bin/
          $TC/bin/clang --version | head -2
          $TC/bin/ld --version 2>&1 | head -3

      - name: Build package (arm64, 不签名)
        run: |
          set -eux
          make clean || true
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS="arm64" \
            TARGET="iphone:clang:16.5:15.0"
          find . -name '*.deb' -ls

      - name: Show output
        if: always()
        run: |
          find . -name '*.deb' 2>/dev/null || true
          find . -name '*.dylib' 2>/dev/null || true
          ls -la packages/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN-deb
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 90
