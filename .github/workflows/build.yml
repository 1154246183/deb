name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make fakeroot git curl unzip xz-utils \
            clang lld llvm libssl-dev libplist-dev pkg-config perl
          clang --version | head -1

      - name: Install ldid
        run: |
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc) CXXFLAGS="-std=c++17 -I. -I./src"
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -2

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          mkdir -p $HOME/theos/sdks

      - name: Download iOS SDK 16.5
        run: |
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk'
          cp -r /tmp/sdkrepo/*.sdk $HOME/theos/sdks/
          ls -d $HOME/theos/sdks/*.sdk

      - name: Fix toolchain path
        run: |
          set -eux
          # Theos 硬编码查找 toolchain/linux/iphone/bin/clang，这里建软链指向系统 clang
          TC=$HOME/theos/toolchain/linux/iphone
          mkdir -p $TC/bin
          for t in clang clang++ ld lld ldid nm strip ar ranlib; do
            src=""
            for c in /usr/bin/$t /usr/local/bin/$t; do
              if [ -x "$c" ]; then src="$c"; break; fi
            done
            if [ -n "$src" ]; then
              ln -sf "$src" $TC/bin/$t
              echo "link $t -> $src"
            else
              echo "跳过 $t（系统无此命令）"
            fi
          done
          ls -la $TC/bin/
          $TC/bin/clang --version | head -2

      - name: Build package (arm64 only, 不签名)
        run: |
          set -eux
          make clean || true
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS="arm64" \
            TARGET="iphone:clang:16.5:15.0"
          find . -name '*.deb' -ls

      - name: Show output
        if: always()
        run: |
          find . -name '*.deb' 2>/dev/null || true
          find . -name '*.dylib' 2>/dev/null || true
          ls -la packages/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN-deb
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 90
