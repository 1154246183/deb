name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang fakeroot git curl unzip xz-utils libssl-dev perl

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo
          cd sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk' 'iPhoneOS15.6.sdk'
          cp -r /tmp/sdkrepo/*.sdk $HOME/theos/sdks/ 2>/dev/null || true
          ls -d $HOME/theos/sdks/*.sdk

      - name: Install ldid
        run: |
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc) CXXFLAGS="-std=c++17" || make -j$(nproc)
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -v || echo "ldid print ok"

      - name: Build package
        run: |
          cd tweak
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          find . -name '*.deb' -ls

      - name: Show artifacts
        if: always()
        run: |
          ls -la tweak/packages 2>/dev/null || true
          find tweak -name '*.deb' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN
          path: tweak/packages/*.deb
          if-no-files-found: warn
