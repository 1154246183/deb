name: Build CocoaTopAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libssl-dev libplist-dev pkg-config perl git curl unzip xz-utils dpkg fakeroot
          which clang dpkg-deb fakeroot

      - name: Setup ld64.lld
        run: |
          for c in /usr/bin/ld64.lld /usr/bin/ld64.lld-* /usr/lib/llvm-*/bin/ld64.lld; do
            if [ -x "$c" ]; then echo "found $c"; break; fi
          done
          if [ ! -x /usr/bin/ld64.lld ]; then
            for c in /usr/bin/ld64.lld-* /usr/lib/llvm-*/bin/ld64.lld; do
              if [ -x "$c" ]; then sudo ln -sf "$c" /usr/bin/ld64.lld; break; fi
            done
          fi
          ls -l /usr/bin/ld64.lld && /usr/bin/ld64.lld --version | head -1

      - name: Download iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdkrepo
          cd /tmp/sdkrepo
          git sparse-checkout set --no-cone 'iPhoneOS16.5.sdk'
          mkdir -p "$HOME/sdk"
          cp -r /tmp/sdkrepo/iPhoneOS16.5.sdk "$HOME/sdk/"
          echo "SDK=$HOME/sdk/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          ls "$HOME/sdk/iPhoneOS16.5.sdk" | head -5

      - name: Compile dylib
        run: |
          mkdir -p out
          clang -target arm64-apple-ios15.0.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -dynamiclib \
            -fuse-ld=/usr/bin/ld64.lld \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/CocoaTopAN.dylib \
            -framework Foundation -framework UIKit \
            -Wl,-platform_version,ios,15.0,16.5 \
            -O2 -o out/CocoaTopAN.dylib Tweak.m
          ls -l out/
          file out/CocoaTopAN.dylib

      - name: Build control file
        run: |
          mkdir -p pkgtmp
          printf '%s\n' \
            'Package: com.dsh.cocoatopan' \
            'Name: CocoaTop 中文注解' \
            'Version: 1.0.0' \
            'Architecture: iphoneos-arm64' \
            'Description: 给 CocoaTop 进程列表加中文作用说明，显示为「进程名 · 说明」。' \
            'Maintainer: dsh' \
            'Author: dsh' \
            'Section: Tweaks' \
            'Depends: mobilesubstrate' \
            'Installed-Size: 120' \
            > pkgtmp/control
          cat pkgtmp/control

      - name: Build postinst
        run: |
          printf '%s\n' \
            '#!/bin/sh' \
            'export PATH=/var/jb/usr/bin:/var/jb/bin:/var/bin:/usr/bin:/bin:/usr/sbin:/sbin' \
            'DEST="/var/jb/Library/Application Support/CocoaTopAN"' \
            'DL="/var/jb/Library/MobileSubstrate/DynamicLibraries"' \
            '[ -f "$DEST/proc-cn.plist" ] && chmod 644 "$DEST/proc-cn.plist"' \
            '[ -f "$DL/CocoaTopAN.dylib" ] && chmod 755 "$DL/CocoaTopAN.dylib"' \
            '[ -f "$DL/CocoaTopAN.plist" ] && chmod 644 "$DL/CocoaTopAN.plist"' \
            'launchctl stop launchdhook 2>/dev/null' \
            'sleep 1' \
            'launchctl start launchdhook 2>/dev/null' \
            'killall -9 CocoaTop 2>/dev/null' \
            'exit 0' \
            > pkgtmp/postinst
          chmod 755 pkgtmp/postinst
          cat pkgtmp/postinst

      - name: Package deb
        run: |
          ROOT=stage
          rm -rf "$ROOT"
          mkdir -p "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$ROOT/var/jb/Library/Application Support/CocoaTopAN"
          mkdir -p "$ROOT/DEBIAN"
          cp out/CocoaTopAN.dylib "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp CocoaTopAN.plist "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp proc-cn.plist "$ROOT/var/jb/Library/Application Support/CocoaTopAN/"
          cp pkgtmp/control "$ROOT/DEBIAN/"
          cp pkgtmp/postinst "$ROOT/DEBIAN/"
          dpkg-deb -b "$ROOT" CocoaTopAN_1.0.0_iphoneos-arm64.deb
          ls -l *.deb
          echo "=== deb 内容 ==="
          dpkg-deb -c CocoaTopAN_1.0.0_iphoneos-arm64.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CocoaTopAN-deb
          path: |
            CocoaTopAN_*.deb
            out/*.dylib
          if-no-files-found: warn
          retention-days: 90
